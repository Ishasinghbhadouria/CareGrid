global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    platform: "caregrid"
    environment: "production"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "caregrid-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["server:5050"]
        labels:
          service: "caregrid-backend"
          hospital: "CarePlus Super-Speciality Hospital"
